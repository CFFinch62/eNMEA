; eNMEA - NMEA 0183 over Wi-Fi verification tool
; Runs on Xteink X3/X4 hardware (ESP32-C3) as a bare dev-kit target.
; This project does NOT depend on CrossInk/CrossPoint firmware or its
; activity/app framework - it only reuses the freeink-sdk hardware libraries
; (display driver + board detection) that CrossInk itself is built on.
;
; freeink-sdk is not vendored in this repo. Before building, clone it next
; to this file:
;   git clone https://github.com/Free-Ink/freeink-sdk.git
; so you end up with ./freeink-sdk/libs/... alongside this platformio.ini.
; See README.md for details and for what still needs verifying against the
; real SDK headers once you have them locally.

[platformio]
; x3 is the default because that is the only board this project is developed
; and tested against. Flashing an x4 binary to an X3 is not a harmless mistake:
; the panels are different sizes (792x528 vs 800x480), so the framebuffer row
; stride is wrong and the screen fills with diagonal black smears. Build x4
; explicitly (`pio run -e x4`) if an X4 ever turns up.
default_envs = x3

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.flash_size = 16MB
; No OTA in this project - huge_app.csv trades the OTA partition for a
; larger single app partition, well clear of what WiFi+WebServer+Preferences
; need. Default esp32-c3-devkitm-1 tables are sized more conservatively.
board_build.partitions = huge_app.csv

build_flags =
  -Iinclude
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -std=gnu++2a
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Only the hardware libs this project actually touches: the e-ink panel
; driver, board/device profiles, the buttons (power-off + settings-erase
; gestures) and the deep-sleep/wake power path.
lib_deps =
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  ; Battery gauge. On the X3 this reads the BQ27220 fuel gauge over I2C, which
  ; BoardConfig enables automatically (FREEINK_BATTERY_I2C_GAUGE follows
  ; FREEINK_DEVICE_X3) and BatteryMonitor initialises Wire for itself. On the X4
  ; the same API falls back to the ADC divider - no per-board code either way.
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor

; X4/X4 Pro panel (800x480). Not the default here and not tested - see the
; default_envs comment above.
;
; -DFREEINK_DEVICE_X4=1: freeink-sdk's BoardConfig.h requires at least one
; -DFREEINK_DEVICE_<NAME> flag (added upstream after this project was last
; verified against freeink-sdk - see IMPLEMENTATION_PLAN.md's ledger note
; about re-verifying after time passes). Without it, BoardConfig.h's
; coherence #error fires and nothing compiles.
[env:x4]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1

; X3 panel (792x528, different controller). freeink-sdk picks the driver at
; runtime via setDisplayX3(), gated here at compile time behind
; ENMEA_BOARD_X3 (see EinkCanvas::begin()) rather than pulling in
; XteinkDetect's runtime auto-detection - this project assumes you know
; which board you're flashing. -DFREEINK_DEVICE_X3=1: see env:x4's comment
; above on why a device flag is required at all.
[env:x3]
extends = base
build_flags =
  ${base.build_flags}
  -DENMEA_BOARD_X3=1
  -DFREEINK_DEVICE_X3=1
